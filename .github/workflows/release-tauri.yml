name: Build & Release (Tauri)

# The Tauri port's Linux/Windows release. Runs separately from release.yml (the Electron build)
# until the cut-over. Both builds share version 2.0.0, so this one uses its own tag,
# v<version>-tauri; drop the suffix when the Electron build is removed.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest glibc still supported, so the AppImage runs on older distros.
          - os: ubuntu-22.04
            platform: linux
            ytdlp: linux
            bundle: appimage/*.AppImage
          - os: windows-latest
            platform: windows
            ytdlp: win
            bundle: nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev file

      - name: Download yt-dlp
        run: node scripts/download-yt-dlp.js ${{ matrix.ytdlp }}

      # tauri build fails on a missing resource (electron-builder skipped it), so the bundled
      # yt-dlp is only added here, after the download.
      - name: Build
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --config release/${{ matrix.platform }}.json
        env:
          # Signs the updater artifacts (createUpdaterArtifacts in release/<os>.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload to draft release
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release view "v${VERSION}-tauri" >/dev/null 2>&1 || \
            gh release create "v${VERSION}-tauri" --draft --title "Snowify v${VERSION} (Tauri)" --notes ""
          gh release upload "v${VERSION}-tauri" src-tauri/target/release/bundle/${{ matrix.bundle }} \
            src-tauri/target/release/bundle/${{ matrix.bundle }}.sig --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # tauri-plugin-updater reads latest.json from the latest release (tauri.conf.json
      # plugins.updater.endpoints): each platform's installer URL and its signature.
      - name: Upload updater manifest
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}-tauri"
          mkdir sigs && gh release download "$TAG" --pattern '*.sig' --dir sigs
          node -e '
            const fs = require("fs");
            const [tag, version, repo] = process.argv.slice(1);
            const sigs = fs.readdirSync("sigs");
            const entry = (ext) => {
              const sig = sigs.find((f) => f.endsWith(ext + ".sig"));
              const asset = sig.slice(0, -4);
              return { signature: fs.readFileSync("sigs/" + sig, "utf8"),
                       url: `https://github.com/${repo}/releases/download/${tag}/${asset}` };
            };
            fs.writeFileSync("latest.json", JSON.stringify({
              version, notes: "", pub_date: new Date().toISOString(),
              platforms: { "linux-x86_64": entry(".AppImage"), "windows-x86_64": entry("-setup.exe") },
            }, null, 2));
          ' "$TAG" "$VERSION" "${{ github.repository }}"
          gh release upload "$TAG" latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release edit "v${VERSION}-tauri" \
            --draft=false \
            --prerelease=${{ inputs.prerelease }} \
            --title "Snowify v${VERSION} (Tauri)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
