[package]
name = "snowify"
version = "2.0.0"
edition = "2024"
description = "Rust (Tauri) backend for Snowify — port of the Electron main process"
license = "MIT"

[dependencies]
futures-util = "0.3"
getrandom = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset", "gzip", "brotli", "deflate"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
libc = "0.2"
icu_normalizer = "2"
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust", "windows-native"] }
url = "2"

[build-dependencies]
tauri-build = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading",
    "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_Pipes",
    "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Registry",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
    "Win32_System_Environment", "Win32_Globalization",
] }

windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[test]]
name = "parity_exec_file"
path = "tests/platform/exec_file.rs"

[[test]]
name = "parity_node"
path = "tests/platform/node.rs"

[[test]]
name = "parity_discord"
path = "tests/platform/discord.rs"

[[test]]
name = "parity_ytdlp"
path = "tests/platform/ytdlp.rs"

[[test]]
name = "parity_cloud_auth"
path = "tests/platform/cloud_auth.rs"

[[test]]
name = "parity_ytstreams"
path = "tests/platform/ytstreams.rs"
